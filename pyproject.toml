[project]
name = "bioinspired-po"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Juan Pedro", email = "juampsyololol@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "manim>=0.21.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pymoo>=0.6.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "quadprog>=0.1.13",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[project.scripts]
bioinspired-po = "bioinspired_po:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
